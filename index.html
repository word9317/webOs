<!DOCTYPE html>
<html>

<head>
  <title>webOS</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/window.css">
  <script src="./assets/js/windowsystem/window.js"></script>
  <script src="./assets/js/windowsystem/window-manager.js"></script>
</head>

<body>
  <div class="topBar" style="z-index: 5;">
    <p class="topBarText">unnamedOS</p>
    <p class="topBarClock" id="clock">time</p>
  </div>
  <div class="desktop"></div>
  <script src="assets/js/clockwidget.js"></script>
  <div id="aboutlauncher" style="transform: translate(5vh, 85vh);">
    <img class="appiconpic" src="./apps/about/abouticon.png">
    <p class="appicontext">About</p>
  </div>
  <div id="lsslauncher" style="transform: translate(13vh, 74.5vh);">
    <img class="appiconpic" src="./apps/lss/favicon.png">
    <p class="appicontext" style="transform: translateX(6px);">LSS</p>
  </div>
  <div id="nopad" style="transform: translate(5vh, 53vh);">
    <img class="appiconpic"style="height: 64px; width: 80px;" src="./apps/scratchpad/icon.png">
    <p class="appicontext" style="transform: translate(-5px, -20px);">scratchpad</p>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      windowManager.init('.desktop');
      windowManager.openWindow('./apps/about/index.html', 'ABOUT', 800, 600, './apps/about/abouticon.png');
    });
    aboutlauncher.addEventListener("click", function(){
      console.log("should open launcher here")
      windowManager.openWindow('./apps/about/index.html', 'ABOUT', 800, 600, './apps/about/abouticon.png');
    });
    lsslauncher.addEventListener("click", function(){
      windowManager.openWindow('./apps/lss/index.html', 'Loading Screen Simulator', 700, 450, './apps/lss/favicon.png');
    });
    nopad.addEventListener("click", function(){
      windowManager.openWindow('./apps/scratchpad/index.html', 'NO pad --', 700, 450, './apps/scratchpad/icon.png');
    });
</script>
</body>

</html>
